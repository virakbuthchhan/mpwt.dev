services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpwt_web_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://mpwt_user:mpwt_secure_pass_2026@postgres:5432/mpwt_dits_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=mpwt-secret-key-2026-dits-gdptr
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: mpwt_postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=mpwt_user
      - POSTGRES_PASSWORD=mpwt_secure_pass_2026
      - POSTGRES_DB=mpwt_dits_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mpwt_user -d mpwt_dits_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: mpwt_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
